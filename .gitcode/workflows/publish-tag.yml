name: Publish Tag

on:
  push:
    tags:
      - "v*"

concurrency:
  # 禁止并发：新运行抢占同一 MR 的旧运行，其余排队等待
  enable: true
  max: 1
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  repository: read

jobs:
  release:
    name: build-and-publish
    runs-on: ubuntu-latest
    env:
      DEVECO_SCOPE: ${{ vars.DEVECO_SCOPE || 'deveco-test' }}
      DEVECO_CHANNEL: ${{ vars.DEVECO_CHANNEL || 'test' }}
      GITCODE_OWNER: openharmony-sig
      GITCODE_REPO: deveco-code
    steps:
      - name: 检出代码
        uses: checkout
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: setup-node
        with:
          node-version: 22

      - name: 安装 Bun
        run: NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ npm install -g bun@1.4.2

      - name: 配置 npm 认证
        run: |
          echo "@${DEVECO_SCOPE}:registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - name: 设置版本
        run: |
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No tag found. Trigger via tag push (v*)."
            exit 1
          fi
          echo "DEVECO_VERSION=${TAG#v}" >> "$ATOMGIT_ENV"
          BRANCH=$(git for-each-ref --format='%(refname:short)' --points-at HEAD refs/remotes/origin/ | head -1 | sed 's|origin/||')
          [ -z "$BRANCH" ] && BRANCH="$ATOMGIT_REF_NAME"

          echo "## 版本信息" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| Tag | \`$TAG\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 版本 | \`${TAG#v}\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 分支 | \`$BRANCH\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| Channel | \`$DEVECO_CHANNEL\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| Scope | \`@$DEVECO_SCOPE\` |" >> "$ATOMGIT_STEP_SUMMARY"

      - name: 准备构建环境
        run: NODEJS_ORG_MIRROR=https://mirrors.huaweicloud.com/nodejs NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ bun install

      - name: 构建 CLI 二进制
        run: |
          cd packages/opencode && bun run script/build.ts
          echo "## 构建" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "✅ CLI 二进制构建完成" >> "$ATOMGIT_STEP_SUMMARY"

      - name: 组装并发布到 npm
        run: |
          cd packages/opencode && bun run script/publish.ts
          echo "## npm 发布" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 包名 | 链接 |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
          for pkgjson in dist/deveco-*/package.json; do
            name=$(jq -r '.name' "$pkgjson")
            echo "| \`$name\` | [npm](https://www.npmjs.com/package/$name) |" >> "$ATOMGIT_STEP_SUMMARY"
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建 GitCode Release 并上传归档
        run: |
          cd packages/opencode
          TAG="v${DEVECO_VERSION}"
          API="https://atomgit.com/api/v5"
          OWNER="${GITCODE_OWNER}"
          REPO="${GITCODE_REPO}"
          TOKEN="${{ secrets.RELEASE_TOKEN }}"

          # 从 CHANGELOG.md 提取当前版本的 changelog
          CHANGELOG_FILE="../../CHANGELOG.md"
          RELEASE_BODY=""
          if [ -f "$CHANGELOG_FILE" ]; then
            # 提取当前版本 section（从 ## vX.Y.Z 到下一个 ## 或文件末尾，去掉版本标题行本身）
            RELEASE_BODY=$(sed -n "/^## ${TAG} /,/^## v/{ /^## ${TAG} /d; /^## v/d; p; }" "$CHANGELOG_FILE" | sed '/^$/N;/^\n$/d')
          fi

          # 如果提取失败，使用 fallback
          if [ -z "$RELEASE_BODY" ]; then
            RELEASE_BODY="DevEco Code ${TAG}"
          fi

          # 追加安装提示
          SEP="---"
          RELEASE_BODY="${RELEASE_BODY}"$'\n\n'"${SEP}"$'\n\n'"如需下载使用，请执行：\`npm install -g @${DEVECO_SCOPE}/deveco-code\`"

          # 将 body 转为 JSON 安全格式
          BODY_JSON=$(printf '%s' "$RELEASE_BODY" | jq -Rs .)

          # 创建 zip 归档
          for dir in dist/deveco-*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../${name}.zip" .)
            echo "Created dist/${name}.zip"
          done

          # 获取或创建 Release
          RELEASE_INFO=$(curl -sS \
            -H "Authorization: Bearer $TOKEN" \
            "$API/repos/$OWNER/$REPO/releases/tags/$TAG")
          RELEASE_TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name // empty')

          if [ -z "$RELEASE_TAG" ]; then
            echo "Creating release $TAG ..."
            RELEASE_INFO=$(curl -sS -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Release $TAG\",\"body\":${BODY_JSON},\"prerelease\":$([ "$DEVECO_CHANNEL" != "latest" ] && echo true || echo false),\"release_status\":\"latest\",\"target_commitish\":\"develop\"}" \
              "$API/repos/$OWNER/$REPO/releases")
            RELEASE_TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name // empty')
            if [ -z "$RELEASE_TAG" ]; then
              echo "ERROR: Failed to create release. Response: $RELEASE_INFO"
              exit 1
            fi
            echo "Created release $TAG"
          else
            echo "Release $TAG already exists, skipping creation (GitCode API does not support release updates)"
          fi

          # 上传归档到 GitCode Release
          # API: GET /repos/{owner}/{repo}/releases/{tag}/upload_url?file_name={filename}
          for zipfile in dist/*.zip; do
            [ -f "$zipfile" ] || continue
            FILENAME=$(basename "$zipfile")
            echo "Uploading $FILENAME ..."

            UPLOAD_INFO=$(curl -sS \
              -H "Authorization: Bearer $TOKEN" \
              "$API/repos/$OWNER/$REPO/releases/$TAG/upload_url?file_name=$FILENAME")
            echo "  upload_url response: $UPLOAD_INFO"

            OBS_URL=$(echo "$UPLOAD_INFO" | jq -r 'if type == "string" then . elif .url? then .url elif .upload_url? then .upload_url else empty end')
            if [ -z "$OBS_URL" ]; then
              echo "  WARNING: No upload URL for $FILENAME. Response: $UPLOAD_INFO"
              continue
            fi

            HDR_PID=$(echo "$UPLOAD_INFO" | jq -r '(.headers // .data.headers // {})["x-obs-meta-project-id"] // empty')
            HDR_ACL=$(echo "$UPLOAD_INFO" | jq -r '(.headers // .data.headers // {})["x-obs-acl"] // empty')
            HDR_CB=$(echo "$UPLOAD_INFO" | jq -r '(.headers // .data.headers // {})["x-obs-callback"] // empty')
            HDR_CT=$(echo "$UPLOAD_INFO" | jq -r '(.headers // .data.headers // {})["Content-Type"] // "application/octet-stream"')

            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT \
              -H "x-obs-meta-project-id: $HDR_PID" \
              -H "x-obs-acl: $HDR_ACL" \
              -H "x-obs-callback: $HDR_CB" \
              -H "Content-Type: $HDR_CT" \
              --upload-file "$zipfile" \
              "$OBS_URL")
            echo "  uploaded $FILENAME (HTTP $HTTP_CODE)"
          done

          echo "GitCode release complete"

          echo "## GitCode Release" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| Release | [查看](https://atomgit.com/$OWNER/$REPO/releases/$TAG) |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 产物数 | $(ls dist/*.zip 2>/dev/null | wc -l) |" >> "$ATOMGIT_STEP_SUMMARY"

      - name: 同步 npmmirror
        run: |
          npm install -g cnpm --registry=https://registry.npmjs.org
          cnpm sync @${DEVECO_SCOPE}/deveco-code
          for pkgjson in packages/opencode/dist/deveco-*/package.json; do
            name=$(jq -r '.name' "$pkgjson")
            cnpm sync "$name"
          done
        continue-on-error: true
