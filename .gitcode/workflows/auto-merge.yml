name: Auto Merge

on:
  pull_request_comment:
    types: [created]
    comments:
      - '/merge'
  schedule:
    # 每 10 分钟兜底扫一次；评论 /merge 走事件触发，不受此周期影响
    - cron: '0 0/10 * * * ?'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "指定要合入的 PR 编号"
        required: true
        type: string

permissions:
  repository: read
  issue: write
  note: write

stages:
  merge:
    name: 自动合入
    jobs:
      auto-merge:
        name: 检查并合入 PR
        runs-on: [self-hosted, deveco_k8s]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/deveco_code/nginx:v1
        env:
          GITCODE_API: https://atomgit.com/api/v5
          GITCODE_REPO: ${{ atomgit.repository }}
          GITCODE_TYPE: pulls
          COMMENT_USER: ${{ atomgit.event.comment.user.login || atomgit.event.comment.user.username }}
          COMMENT_BODY: ${{ atomgit.event.comment.body }}
        steps:
          - name: 检出代码
            uses: checkout
            with:
              fetch-depth: 1

          - name: 确保 jq 可用
            run: bash .gitcode/scripts/ensure-jq.sh

          - name: 检查 CI 状态并合入
            env:
              GITCODE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
              PR_NUMBER_INPUT: ${{ inputs.pr_number }}
              ISSUE_NUMBER: ${{ atomgit.event.issue.number }}
            run: |
              PR_NUMBER="${{ inputs.pr_number || atomgit.event.pull_request.number || atomgit.event.issue.number }}"

              if [ -n "$COMMENT_USER" ]; then
                # 优先用触发事件的评论内容判断，避免并发评论导致"最新评论"竞态；事件上下文缺失时回退到最新评论
                COMMAND_BODY="${COMMENT_BODY:-$(bash .gitcode/scripts/gitcode-api.sh list-comments "$PR_NUMBER" | jq -r 'sort_by(.created_at) | last | .body // ""')}"
                TRIMMED=$(printf '%s' "$COMMAND_BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
                case "$TRIMMED" in
                  '/merge'*) ;;
                  *)
                    echo "触发评论不是 /merge 命令,跳过合入"
                    exit 0
                    ;;
                esac
              fi

              check_and_merge() {
                NUMBER="$1"
                PR_DATA=$(curl -s -H "Authorization: Bearer $GITCODE_TOKEN" \
                  "$GITCODE_API/repos/$GITCODE_REPO/pulls/$NUMBER" 2>/dev/null)

                STATE=$(echo "$PR_DATA" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('state',''))" 2>/dev/null)
                if [ "$STATE" != "open" ]; then
                  echo "PR #$NUMBER is not open ($STATE), skipping"
                  return 1
                fi

                CI_RESULT=$(bash .gitcode/scripts/gitcode-api.sh check-ci "$NUMBER" 2>/dev/null || echo "CI 检查失败")

                MERGEABLE=$(echo "$PR_DATA" | python3 -c "
              import json,sys
              d = json.load(sys.stdin)
              ms = d.get('mergeable_state', {})
              labels = {
                  'conflict_passed': '无代码冲突',
                  'mr_state_passed': 'PR 状态合法',
                  'approval_testers_required_passed': '测试人审批通过',
                  'approval_reviewers_required_passed': '审查人审批通过',
                  'approval_approvers_required_passed': '评审人审批通过',
              }
              failed = [v for k, v in labels.items() if not ms.get(k, False)]
              method = 'rebase' if not ms.get('non_ff_passed', False) else 'ff'
              if failed:
                  print(f'FAIL:{method}:' + ';'.join(failed))
              else:
                  print(f'OK:{method}')
              " 2>/dev/null)

                FAILED_ITEMS=""
                MERGE_METHOD=""
                if [[ "$MERGEABLE" == FAIL:* ]]; then
                  MERGE_METHOD=$(echo "$MERGEABLE" | cut -d: -f2)
                  FAILED_ITEMS=$(echo "$MERGEABLE" | sed 's/^FAIL:[^:]*://')
                else
                  MERGE_METHOD=$(echo "$MERGEABLE" | sed 's/^OK://')
                fi
                if [ "$CI_RESULT" != "OK" ] && [ -n "$CI_RESULT" ]; then
                  if [ -n "$FAILED_ITEMS" ]; then
                    FAILED_ITEMS="${FAILED_ITEMS};${CI_RESULT}"
                  else
                    FAILED_ITEMS="$CI_RESULT"
                  fi
                fi

                if [ -n "$FAILED_ITEMS" ]; then
                  echo "PR #$NUMBER checks not passed, skipping"
                  if [ -n "$PR_NUMBER_INPUT" ] || [ -n "$ISSUE_NUMBER" ]; then
                    {
                      echo '## ⏳ 暂无法合入'
                      echo ''
                      echo '以下检查项尚未通过：'
                      echo ''
                      for item in $(echo "$FAILED_ITEMS" | tr ';' ' '); do
                        echo "- ❌ $item"
                      done
                      echo ''
                      echo '请等待上述检查全部通过后再评论 `/merge`。'
                    } | bash .gitcode/scripts/gitcode-api.sh post-comment "$NUMBER"
                  fi
                  return 1
                fi
                echo "PR #$NUMBER all checks passed (method=$MERGE_METHOD), merging..."
                MERGE_OUTPUT=$(bash .gitcode/scripts/gitcode-api.sh merge-pr "$NUMBER" "$MERGE_METHOD" 2>&1) \
                  || MERGE_OUTPUT="merge request failed: $MERGE_OUTPUT"

                MERGE_STATE=""
                for ATTEMPT in 1 2 3; do
                  if [ "$ATTEMPT" != "1" ]; then
                    sleep 5
                  fi
                  MERGE_STATE=$(bash .gitcode/scripts/gitcode-api.sh get-issue "$NUMBER" 2>/dev/null | \
                    python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('state',''))" 2>/dev/null || true)
                  if [ "$MERGE_STATE" = "merged" ]; then
                    break
                  fi
                done

                if [ "$MERGE_STATE" != "merged" ]; then
                  echo "PR #$NUMBER merge failed (state=$MERGE_STATE): $MERGE_OUTPUT"
                  if [ -n "$PR_NUMBER_INPUT" ] || [ -n "$ISSUE_NUMBER" ]; then
                    {
                      echo '## ❌ 自动合入失败'
                      echo ''
                      echo "PR 当前状态为 \`$MERGE_STATE\`，未确认合入成功。"
                      echo ''
                      echo '```'
                      echo "$MERGE_OUTPUT"
                      echo '```'
                      echo ''
                      echo '请检查 PR 状态后重试 `/merge`。'
                    } | bash .gitcode/scripts/gitcode-api.sh post-comment "$NUMBER"
                  fi
                  return 1
                fi

                {
                  echo '## ✅ PR 已自动合入'
                  echo ''
                  echo '所有 CI 检查已通过，PR 已自动合入。'
                } | bash .gitcode/scripts/gitcode-api.sh post-comment "$NUMBER"

                echo "PR #$NUMBER merged successfully"
                return 0
              }

              if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
                echo "Schedule mode: scanning open PRs"

                RESPONSE=$(curl -s -H "Authorization: Bearer $GITCODE_TOKEN" \
                  "$GITCODE_API/repos/$GITCODE_REPO/pulls?state=open&per_page=20" 2>/dev/null)

                NUMBERS=$(echo "$RESPONSE" | python3 -c "
              import json, sys
              data = json.load(sys.stdin)
              for pr in data:
                  print(pr.get('number') or pr.get('iid', ''))
              " 2>/dev/null)

                MERGED=0
                for NUMBER in $NUMBERS; do
                  [ -z "$NUMBER" ] && continue
                  if check_and_merge "$NUMBER"; then
                    MERGED=$((MERGED + 1))
                  fi
                done

                echo "## 自动合入" >> "$ATOMGIT_STEP_SUMMARY"
                echo "本轮合入 $MERGED 个 PR" >> "$ATOMGIT_STEP_SUMMARY"
                exit 0
              fi

              echo "Comment/manual mode: checking PR #$PR_NUMBER"
              if ! check_and_merge "$PR_NUMBER"; then
                exit 1
              fi

              echo "## 自动合入" >> "$ATOMGIT_STEP_SUMMARY"
              echo "✅ PR #$PR_NUMBER 已合入" >> "$ATOMGIT_STEP_SUMMARY"
