name: Build

on:
  pull_request:
    types:
      - open
      - reopen
      - update
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  repository: read
  pr: read

stages:
  build:
    name: 构建
    jobs:
      build:
        name: build-cli
        runs-on: ubuntu-latest
        steps:
          - name: 检出代码
            uses: checkout
            with:
              fetch-depth: 0
              ref: ${{ atomgit.sha }}
          - name: 设置 Node.js
            uses: setup-node
            with:
              node-version: 22
          - name: 安装 Bun
            run: NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ npm install -g bun@1.3.14
          - name: 准备构建环境
            run: NODEJS_ORG_MIRROR=https://mirrors.huaweicloud.com/nodejs NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ bun install
          - name: 构建 CLI 二进制
            id: build
            run: cd packages/opencode && bun run script/build.ts
          - name: 步骤摘要
            if: always()
            env:
              # MR 构建时 ATOMGIT_REF_NAME 是 merge ref（如 830/merge），改用 PR 源分支
              SUMMARY_BRANCH: ${{ atomgit.head_ref || atomgit.ref_name }}
              BUILD_RESULT: ${{ steps.build.conclusion }}
            run: |
              echo "## Build" >> "$ATOMGIT_STEP_SUMMARY"
              echo "" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 项目 | 状态 |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 分支 | \`$SUMMARY_BRANCH\` |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 触发 | \`$ATOMGIT_EVENT_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 构建 | \`$BUILD_RESULT\` |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "" >> "$ATOMGIT_STEP_SUMMARY"
              echo "### 构建目标" >> "$ATOMGIT_STEP_SUMMARY"
              echo "" >> "$ATOMGIT_STEP_SUMMARY"
              for dir in packages/opencode/dist/deveco-*/; do
                [ -d "$dir" ] || continue
                echo "- \`$(basename "$dir")\`" >> "$ATOMGIT_STEP_SUMMARY"
              done
