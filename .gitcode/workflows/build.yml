name: Build

on:
  pull_request:
    types:
      - open
      - reopen
      - update
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  repository: read
  pr: read

stages:
  build:
    name: 构建
    jobs:
      build:
        name: build-cli
        runs-on: [self-hosted, deveco_k8s]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/deveco_code/nginx:v1
        steps:
          - name: 检出代码
            uses: checkout
            with:
              fetch-depth: 0
              ref: ${{ atomgit.sha }}
          - name: 设置 Node.js
            uses: setup-node
            with:
              node-version: 22
          - name: 安装 Bun
            run: NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ npm install -g bun@1.4.2
          - name: 缓存 bun 依赖
            uses: cache
            with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
              restore-keys: |
                bun-${{ runner.os }}-
          - name: 准备构建环境
            run: NODEJS_ORG_MIRROR=https://mirrors.huaweicloud.com/nodejs NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ bun install --frozen-lockfile
          - name: 修复 bin 可执行权限
            # 镜像缓存的 bin 缺 +x，bun 会把它当成 missing script
            run: find . -path '*/node_modules/.bin/*' -type l -exec chmod +x {} +
          - name: 构建 CLI 二进制
            id: build
            # 只编 darwin-arm64 做编译闸门；registry 镜像避免 build.ts 内部安装走 npmjs
            env:
              NPM_CONFIG_REGISTRY: https://mirrors.huaweicloud.com/repository/npm/
              NODEJS_ORG_MIRROR: https://mirrors.huaweicloud.com/nodejs
            run: cd packages/opencode && bun run script/build.ts --target=darwin-arm64
          - name: 步骤摘要
            if: always()
            env:
              # MR 构建时 ATOMGIT_REF_NAME 是 merge ref（如 830/merge），改用 PR 源分支
              SUMMARY_BRANCH: ${{ atomgit.head_ref || atomgit.ref_name }}
              BUILD_RESULT: ${{ steps.build.conclusion }}
            run: |
              echo "## Build" >> "$ATOMGIT_STEP_SUMMARY"
              echo "" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 项目 | 状态 |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 分支 | \`$SUMMARY_BRANCH\` |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 触发 | \`$ATOMGIT_EVENT_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 构建 | \`$BUILD_RESULT\` |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "" >> "$ATOMGIT_STEP_SUMMARY"
              echo "### 构建目标" >> "$ATOMGIT_STEP_SUMMARY"
              echo "" >> "$ATOMGIT_STEP_SUMMARY"
              for dir in packages/opencode/dist/deveco-*/; do
                [ -d "$dir" ] || continue
                echo "- \`$(basename "$dir")\`" >> "$ATOMGIT_STEP_SUMMARY"
              done
