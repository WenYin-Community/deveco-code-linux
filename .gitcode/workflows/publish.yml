name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号 (e.g. 0.1.4)"
        required: true
        type: string
      channel:
        description: "npm dist-tag (latest, td, beta)"
        required: false
        default: "td"
        type: string
      scope:
        description: "npm scope (deveco, deveco-test)"
        required: false
        default: "deveco-test"
        type: string

permissions:
  repository: read

jobs:
  release:
    name: manual-build-and-publish
    runs-on: ubuntu-latest
    env:
      DEVECO_SCOPE: ${{ inputs.scope }}
      DEVECO_CHANNEL: ${{ inputs.channel }}
      GITCODE_OWNER: openharmony-sig
      GITCODE_REPO: deveco-code
    steps:
      - name: 检出代码
        uses: checkout
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: setup-node
        with:
          node-version: 22

      - name: 安装 Bun
        run: NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ npm install -g bun@1.4.2

      - name: 升级 npm
        # npm stage publish 需要 npm CLI >= 11.15.0（Node 22 自带的 npm 10.x 不支持）。
        # npm 原位全局自升级会在收尾输出阶段因自身文件被新版本替换而崩溃（MODULE_NOT_FOUND），
        # 此时新版本通常已安装成功：重试一次，并以 npm --version 硬性校验兜底。
        run: |
          export NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/
          npm install -g npm@11 || npm install -g npm@11 || true
          NPM_VERSION=$(npm --version 2>/dev/null || echo 0.0.0)
          echo "npm version: $NPM_VERSION"
          if [ "$(printf '%s\n' 11.15.0 "$NPM_VERSION" | sort -V | head -1)" != "11.15.0" ]; then
            echo "::error::npm 升级失败：$NPM_VERSION < 11.15.0（npm stage 需要）"
            exit 1
          fi

      - name: 配置 npm 认证
        run: |
          echo "@${DEVECO_SCOPE}:registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - name: 设置版本
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "DEVECO_VERSION=${VERSION}" >> "$ATOMGIT_ENV"

          COMMIT_SHA=$(git rev-parse HEAD)

          echo "## 版本信息" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 版本 | \`$VERSION\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 分支 | \`$ATOMGIT_REF_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| Commit | [\`${COMMIT_SHA:0:7}\`](https://gitcode.com/$GITCODE_OWNER/$GITCODE_REPO/commit/$COMMIT_SHA) |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| Channel | \`$DEVECO_CHANNEL\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| Scope | \`@$DEVECO_SCOPE\` |" >> "$ATOMGIT_STEP_SUMMARY"

      - name: 准备构建环境
        run: NODEJS_ORG_MIRROR=https://mirrors.huaweicloud.com/nodejs NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ bun install

      - name: 构建 CLI 二进制
        run: |
          cd packages/opencode && bun run script/build.ts
          echo "## 构建" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "✅ CLI 二进制构建完成" >> "$ATOMGIT_STEP_SUMMARY"

      - name: 组装并 stage 发布到 npm
        run: |
          cd packages/opencode && bun run script/publish.ts
          echo "## npm Stage 发布" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 包名 | 状态 |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
          for pkgjson in dist/deveco*/package.json; do
            name=$(jq -r '.name' "$pkgjson")
            echo "| \`$name\` | 已 stage，等待 2FA 审批（[npm](https://www.npmjs.com/package/$name)） |" >> "$ATOMGIT_STEP_SUMMARY"
          done
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "> Stage 发布不会立即公开新版本，需要维护者审批：\`npm stage list <包名> --json\` 查询 stage-id，然后执行 \`npm stage approve <stage-id>\`（需要 2FA）；或在 npmjs.com 的 Staged Packages 页面审批。" >> "$ATOMGIT_STEP_SUMMARY"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
