name: Test

on:
  pull_request:
    types:
      - open
      - reopen
      - update
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  repository: read
  pr: read

stages:
  check:
    name: 代码检查
    jobs:
      test:
        name: unit-test
        runs-on: ubuntu-latest
        steps:
          - name: 检出代码
            uses: checkout
            with:
              fetch-depth: 0
              ref: ${{ atomgit.sha }}
          - name: 设置 Node.js
            uses: setup-node
            with:
              node-version: 22
          - name: 安装 Bun
            run: NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ npm install -g bun@1.3.14
          - name: 准备构建环境
            run: NODEJS_ORG_MIRROR=https://mirrors.huaweicloud.com/nodejs NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ bun install
          - name: 运行单元测试
            run: bun turbo test --output-logs=errors-only --log-order=grouped --log-prefix=task
            env:
              OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
          - name: 步骤摘要
            if: always()
            run: |
              echo "## Unit Tests" >> "$ATOMGIT_STEP_SUMMARY"
              echo "" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 项目 | 值 |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 分支 | \`$ATOMGIT_REF_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 触发 | \`$ATOMGIT_EVENT_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 时限 | 20 分钟 |" >> "$ATOMGIT_STEP_SUMMARY"
