name: Test

on:
  pull_request:
    types:
      - open
      - reopen
      - update
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  repository: read
  pr: read

stages:
  check:
    name: 代码检查
    jobs:
      test:
        name: unit-test
        runs-on: [self-hosted, deveco_k8s]
        steps:
          - name: 检出代码
            uses: checkout
            with:
              fetch-depth: 0
              ref: ${{ atomgit.sha }}
          - name: 设置 Node.js
            uses: setup-node
            with:
              node-version: 22
          - name: 安装 Bun
            run: NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ npm install -g bun@1.4.2
          - name: 配置 apt 镜像
            run: |
              SUDO=(); if [ "$(id -u)" -ne 0 ]; then SUDO=(sudo); fi
              for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
                [ -f "$f" ] || continue
                "${SUDO[@]}" sed -i -E \
                  's#https?://(archive|security)\.ubuntu\.com/ubuntu#https://mirrors.huaweicloud.com/ubuntu#g' "$f"
              done
              "${SUDO[@]}" apt-get update -qq
          - name: 安装 ripgrep
            run: |
              if command -v rg >/dev/null; then exit 0; fi
              (sudo apt-get install -y -qq ripgrep) || (apt-get install -y -qq ripgrep)
              rg --version | head -1
          - name: 升级 git
            # snapshot 依赖 rev-parse --path-format，镜像自带的 2.25 不支持
            run: |
              if git --version | awk '{print $3}' | awk -F. '{exit !(($1>2)||($1==2&&$2+0>=31))}'; then
                echo "git $(git --version) 已满足 >= 2.31"
                exit 0
              fi
              echo "当前 $(git --version)，开始升级"
              SUDO=(); if [ "$(id -u)" -ne 0 ]; then SUDO=(sudo); fi
              "${SUDO[@]}" apt-get update -qq
              "${SUDO[@]}" apt-get install -y -qq software-properties-common
              if ! "${SUDO[@]}" add-apt-repository -y ppa:git-core/ppa; then
                curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xA1715D88E1DF1F24" \
                  | "${SUDO[@]}" apt-key add -
                "${SUDO[@]}" rm -f /etc/apt/sources.list.d/git-core*.list
                echo "deb https://ppa.launchpadcontent.net/git-core/ppa/ubuntu focal main" \
                  | "${SUDO[@]}" tee /etc/apt/sources.list.d/git-core-ppa.list > /dev/null
              fi
              "${SUDO[@]}" apt-get update -qq
              "${SUDO[@]}" apt-get install -y -qq git
              git --version
              git rev-parse --path-format=absolute --git-path info/exclude > /dev/null
          - name: 缓存 bun 依赖
            uses: cache
            with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
              restore-keys: |
                bun-${{ runner.os }}-
          - name: 准备构建环境
            run: NODEJS_ORG_MIRROR=https://mirrors.huaweicloud.com/nodejs NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ bun install --frozen-lockfile
          - name: 修复 bin 可执行权限
            # 镜像缓存的 bin 缺 +x，bun 会把它当成 missing script
            run: find . -path '*/node_modules/.bin/*' -type l -exec chmod +x {} +
          - name: 运行单元测试
            run: bun turbo test --output-logs=errors-only --log-order=grouped --log-prefix=task
            env:
              OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
              DEVECO_DISABLE_MODELS_FETCH: "true"
          - name: 步骤摘要
            if: always()
            run: |
              echo "## Unit Tests" >> "$ATOMGIT_STEP_SUMMARY"
              echo "" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 项目 | 值 |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 分支 | \`$ATOMGIT_REF_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 触发 | \`$ATOMGIT_EVENT_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 时限 | 20 分钟 |" >> "$ATOMGIT_STEP_SUMMARY"
