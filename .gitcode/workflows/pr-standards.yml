name: PR Standards

on:
  pull_request_target:
    types: [open, reopen, update]
    branches: ["**"]
  pull_request_comment:
    types: [created]
    comments:
      - '/recheck'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "指定要检查的 PR 编号"
        required: true
        type: string

permissions:
  repository: read
  issue: write
  note: write

stages:
  check-standards:
    name: 检查标题与关联
    jobs:
      check-standards:
        name: 标题格式与关联 Issue
        runs-on: ubuntu-latest
        env:
          GITCODE_API: https://atomgit.com/api/v5
          GITCODE_REPO: ${{ atomgit.repository }}
          COMMENT_USER: ${{ atomgit.event.comment.user.login || atomgit.event.comment.user.username }}
          COMMENT_BODY: ${{ atomgit.event.comment.body }}
        steps:
          - name: 检出代码
            uses: checkout
            with:
              fetch-depth: 1
              ref: ${{ atomgit.sha }}

          - name: 确保 jq 可用
            run: bash .gitcode/scripts/ensure-jq.sh

          - name: 检查标题与关联 Issue
            env:
              GITCODE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
              GITCODE_TYPE: pulls
            run: |
              PR_NUMBER="${{ inputs.pr_number || atomgit.event.pull_request.number || atomgit.event.issue.number }}"

              if [ -z "$PR_NUMBER" ]; then
                echo "No PR number found"
                exit 1
              fi

              if [ -n "$COMMENT_USER" ]; then
                # 优先用触发事件的评论内容判断，避免并发评论导致"最新评论"竞态；事件上下文缺失时回退到最新评论
                COMMAND_BODY="${COMMENT_BODY:-$(bash .gitcode/scripts/gitcode-api.sh list-comments "$PR_NUMBER" | jq -r 'sort_by(.created_at) | last | .body // ""')}"
                TRIMMED=$(printf '%s' "$COMMAND_BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
                case "$TRIMMED" in
                  '/recheck'*) ;;
                  *)
                    echo "触发评论不是 /recheck 命令,跳过检查"
                    exit 0
                    ;;
                esac
              fi

              echo "Checking PR #$PR_NUMBER"

              bash .gitcode/scripts/gitcode-api.sh reset-test "$PR_NUMBER" || true

              PR_DATA=$(bash .gitcode/scripts/gitcode-api.sh get-issue "$PR_NUMBER")
              TITLE=$(echo "$PR_DATA" | jq -r '.title // ""')

              echo "Title: $TITLE"

              CLEAN_TITLE=$(echo "$TITLE" | sed 's/^\[[^]]*\]//')
              TITLE_PATTERN='^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([^)]+\))?!?: .{1,72}$'
              if ! echo "$CLEAN_TITLE" | grep -qP "$TITLE_PATTERN"; then
                echo "Title does not follow conventional commit format"

                bash .gitcode/scripts/gitcode-api.sh add-label "$PR_NUMBER" waiting_on_author

                {
                  echo '<!-- pr-standards:title -->'
                  echo '## 📝 标题格式不符合规范'
                  echo ''
                  echo '你的 PR 标题不符合[约定式提交](https://www.conventionalcommits.org/)格式。'
                  echo ''
                  echo '**请修改标题，使其以下列前缀之一开头：**'
                  echo ''
                  echo '| 前缀 | 说明 |'
                  echo '|------|------|'
                  echo '| `feat:` | 新功能 |'
                  echo '| `fix:` | Bug 修复 |'
                  echo '| `docs:` | 文档变更 |'
                  echo '| `style:` | 代码格式 |'
                  echo '| `chore:` | 维护任务 |'
                  echo '| `refactor:` | 代码重构 |'
                  echo '| `perf:` | 性能优化 |'
                  echo '| `test:` | 测试相关 |'
                  echo '| `build:` | 构建系统 |'
                  echo '| `ci:` | CI 配置 |'
                  echo '| `revert:` | 回退变更 |'
                  echo ''
                  echo '> 可选 scope：`feat(scope):`，scope 为包名（如 `app`、`desktop`、`deveco`）'
                  echo '>'
                  echo '> 破坏性变更：`feat!:` 或 `feat(scope)!:`'
                  echo '>'
                  echo '> 描述部分不超过 72 字符'
                  echo ''
                  echo '详见[贡献指南 - PR 标题](https://atomgit.com/openharmony-sig/deveco-code/blob/develop/CONTRIBUTING.md#pr-titles)。'
                } | bash .gitcode/scripts/gitcode-api.sh post-comment "$PR_NUMBER"

                exit 1
              fi

              echo "Title is valid"

              LINKED_ISSUES=$(bash .gitcode/scripts/gitcode-api.sh list-linked-issues "$PR_NUMBER")
              LINKED_COUNT=$(echo "$LINKED_ISSUES" | jq -r 'if type == "array" then length else 0 end' 2>/dev/null)

              if [ "$LINKED_COUNT" -gt 0 ]; then
                echo "Linked issues found: $LINKED_COUNT"
                exit 0
              fi

              echo "No issue reference found"

              bash .gitcode/scripts/gitcode-api.sh add-label "$PR_NUMBER" waiting_on_author

              {
                echo '<!-- pr-standards:issue -->'
                echo '## 🔗 未关联 Issue'
                echo ''
                echo '所有 PR 必须引用一个已存在的 Issue。'
                echo ''
                echo '**操作步骤：**'
                echo ''
                echo '1. 创建一个 Issue 描述 Bug 或功能需求（如果尚不存在）'
                echo '2. 在此 PR 描述的 `### Issue for this PR` 段落中填写 `Closes #<编号>`'
                echo ''
                echo '详见[贡献指南 - Issue 优先](https://atomgit.com/openharmony-sig/deveco-code/blob/develop/CONTRIBUTING.md#issue-first-policy)。'
              } | bash .gitcode/scripts/gitcode-api.sh post-comment "$PR_NUMBER"

              exit 1

  check-compliance:
    name: 检查 PR 模板合规
    jobs:
      check-compliance:
        name: PR 模板合规检查
        runs-on: ubuntu-latest
        env:
          GITCODE_API: https://atomgit.com/api/v5
          GITCODE_REPO: ${{ atomgit.repository }}
          COMMENT_USER: ${{ atomgit.event.comment.user.login || atomgit.event.comment.user.username }}
          COMMENT_BODY: ${{ atomgit.event.comment.body }}
        steps:
          - name: 检出代码
            uses: checkout
            with:
              fetch-depth: 1
              ref: ${{ atomgit.sha }}

          - name: 确保 jq 可用
            run: bash .gitcode/scripts/ensure-jq.sh

          # 以下两个软提醒只发评论，永远 exit 0，不影响本 job 的硬门禁结论。
          # 放在硬门禁之前，避免合规检查中途 exit 1 把它们跳过。
          - name: 提醒根 CHANGELOG 改动
            env:
              GITCODE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
              GITCODE_TYPE: pulls
            run: |
              set +e
              PR_NUMBER="${{ inputs.pr_number || atomgit.event.pull_request.number || atomgit.event.issue.number }}"

              if [ -z "$PR_NUMBER" ]; then
                echo "No PR number found"
                exit 0
              fi

              # 非 /recheck 评论触发时不重复检查，避免刷评论
              if [ -n "$COMMENT_USER" ]; then
                TRIMMED=$(printf '%s' "${COMMENT_BODY:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
                case "$TRIMMED" in
                  '/recheck'*) ;;
                  *) echo "非 /recheck 评论，跳过"; exit 0 ;;
                esac
              fi

              PR_DATA=$(bash .gitcode/scripts/gitcode-api.sh get-issue "$PR_NUMBER")
              HEAD_REF=$(echo "$PR_DATA" | jq -r '.head.ref // ""' 2>/dev/null)

              # 发版分支（*-changelog）是唯一允许改动根 CHANGELOG.md 的通道
              case "$HEAD_REF" in
                *-changelog | *-changelog/*)
                  echo "Release branch '$HEAD_REF' — skipping CHANGELOG guard."
                  exit 0
                  ;;
              esac

              TOUCHED=$(curl -sS -H "Authorization: Bearer $GITCODE_TOKEN" \
                "$GITCODE_API/repos/$GITCODE_REPO/pulls/$PR_NUMBER/files" \
                | jq -r 'if type == "array" then ([.[] | .filename] | index("CHANGELOG.md") != null) else false end' 2>/dev/null)

              COMMENTS=$(bash .gitcode/scripts/gitcode-api.sh list-comments "$PR_NUMBER")
              OLD=$(echo "$COMMENTS" | jq -r '.[] | select(.body | contains("pr-advisory:changelog")) | .id' 2>/dev/null)

              # CHANGELOG 从改动里撤掉后，顺手删掉旧提醒，别留成永久污点
              if [ "$TOUCHED" != "true" ]; then
                for CID in $OLD; do
                  bash .gitcode/scripts/gitcode-api.sh delete-comment "$CID"
                done
                echo "CHANGELOG.md not touched — OK."
                exit 0
              fi

              echo "PR #$PR_NUMBER touches root CHANGELOG.md."
              echo "## Changelog Guard" >> "$ATOMGIT_STEP_SUMMARY"
              echo "⚠️ PR #$PR_NUMBER 改动了根 CHANGELOG.md（已提醒，未阻断合并）" >> "$ATOMGIT_STEP_SUMMARY"

              if [ -n "$OLD" ]; then
                echo "已提醒过，跳过重复评论"
                exit 0
              fi

              {
                echo '<!-- pr-advisory:changelog -->'
                echo '## ℹ️ 这个 PR 改动了根 `CHANGELOG.md`'
                echo ''
                echo '根 `CHANGELOG.md` 由发版负责人基于 commit 统一生成，日常开发请勿顺手改动，'
                echo '否则下次发版会重复或漏掉条目。'
                echo ''
                echo '建议：`git restore --staged CHANGELOG.md` 后重新提交，把用户可见的变更'
                echo '写进 commit message / PR 描述。'
                echo ''
                echo '若本次确实是发版，请从 `*-changelog` 分支发起 PR（例如 `v0.2.6-changelog`），此检查会自动跳过。'
                echo ''
                echo '详见 [AGENTS.md - CHANGELOG Ownership](https://atomgit.com/openharmony-sig/deveco-code/blob/develop/AGENTS.md#changelog-ownership)。'
              } | bash .gitcode/scripts/gitcode-api.sh post-comment "$PR_NUMBER"

              exit 0

          - name: 提醒 PR commit 数量
            env:
              GITCODE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
              GITCODE_TYPE: pulls
            run: |
              set +e
              PR_NUMBER="${{ inputs.pr_number || atomgit.event.pull_request.number || atomgit.event.issue.number }}"

              if [ -z "$PR_NUMBER" ]; then
                echo "No PR number found"
                exit 0
              fi

              # 非 /recheck 评论触发时不重复检查，避免刷评论
              if [ -n "$COMMENT_USER" ]; then
                TRIMMED=$(printf '%s' "${COMMENT_BODY:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
                case "$TRIMMED" in
                  '/recheck'*) ;;
                  *) echo "非 /recheck 评论，跳过"; exit 0 ;;
                esac
              fi

              PR_DATA=$(bash .gitcode/scripts/gitcode-api.sh get-issue "$PR_NUMBER")
              if [ "$(echo "$PR_DATA" | jq -r '.draft // false')" = "true" ]; then
                echo "Draft PR — skipping."
                exit 0
              fi

              COUNT=$(curl -sS -H "Authorization: Bearer $GITCODE_TOKEN" \
                "$GITCODE_API/repos/$GITCODE_REPO/pulls/$PR_NUMBER/commits?per_page=100" \
                | jq -r 'if type == "array" then length else 0 end' 2>/dev/null)
              COUNT=${COUNT:-0}

              COMMENTS=$(bash .gitcode/scripts/gitcode-api.sh list-comments "$PR_NUMBER")
              OLD=$(echo "$COMMENTS" | jq -r '.[] | select(.body | contains("pr-advisory:commits")) | .id' 2>/dev/null)

              # 压回 10 个以内后删掉旧提醒，避免评论变成永久污点
              if [ "$COUNT" -le 10 ]; then
                for CID in $OLD; do
                  bash .gitcode/scripts/gitcode-api.sh delete-comment "$CID"
                done
                echo "PR #$PR_NUMBER has $COUNT commits — OK."
                exit 0
              fi

              echo "PR #$PR_NUMBER has $COUNT commits (> 10)."
              echo "## PR Commit 数" >> "$ATOMGIT_STEP_SUMMARY"
              echo "⚠️ $COUNT 个 commit（已提醒，未阻断合并）" >> "$ATOMGIT_STEP_SUMMARY"

              if [ -n "$OLD" ]; then
                echo "已提醒过，跳过重复评论"
                exit 0
              fi

              {
                echo '<!-- pr-advisory:commits -->'
                echo "## ℹ️ 这个 PR 有 $COUNT 个 commit，超过建议上限 10 个"
                echo ''
                echo '通常是「写一点提交一点」留下的，合入后 develop 历史会难 bisect / revert。'
                echo ''
                echo '建议合入前按功能聚合：'
                echo '```'
                echo 'git rebase -i $(git merge-base HEAD origin/develop)   # 同功能用 fixup/squash'
                echo 'git push --force-with-lease'
                echo '```'
                echo '或直接用平台的 Squash merge 合入。'
                echo ''
                echo '按功能/特性分到 10 个以内完全允许，不需要压成 1 个。'
              } | bash .gitcode/scripts/gitcode-api.sh post-comment "$PR_NUMBER"

              exit 0

          - name: 检查 PR 模板合规性
            env:
              GITCODE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
              GITCODE_TYPE: pulls
            run: |
              PR_NUMBER="${{ inputs.pr_number || atomgit.event.pull_request.number || atomgit.event.issue.number }}"

              if [ -z "$PR_NUMBER" ]; then
                echo "No PR number found"
                exit 1
              fi

              if [ -n "$COMMENT_USER" ]; then
                # 优先用触发事件的评论内容判断，避免并发评论导致"最新评论"竞态；事件上下文缺失时回退到最新评论
                COMMAND_BODY="${COMMENT_BODY:-$(bash .gitcode/scripts/gitcode-api.sh list-comments "$PR_NUMBER" | jq -r 'sort_by(.created_at) | last | .body // ""')}"
                TRIMMED=$(printf '%s' "$COMMAND_BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
                case "$TRIMMED" in
                  '/recheck'*) ;;
                  *)
                    echo "触发评论不是 /recheck 命令,跳过检查"
                    exit 0
                    ;;
                esac
              fi

              echo "Checking PR #$PR_NUMBER compliance"

              PR_DATA=$(bash .gitcode/scripts/gitcode-api.sh get-issue "$PR_NUMBER")

              TITLE=$(echo "$PR_DATA" | jq -r '.title // ""')
              BODY=$(echo "$PR_DATA" | jq -r '.body // ""')

              ISSUES=""
              add_issue() {
                if [ -z "$ISSUES" ]; then
                  ISSUES="$1"
                else
                  ISSUES="$ISSUES"$'\n'"- $1"
                fi
              }

              # 模板段落定义（顺序即模板顺序）
              TPL_HEADERS=$'### Issue for this PR\n### Type of change\n### What does this PR do?\n### How did you verify your code works?\n### Screenshots / recordings\n### Checklist'

              # 检查段落是否存在
              HAS_ISSUE_SEC=$(echo "$BODY" | grep -q '### Issue for this PR' && echo 1 || echo 0)
              HAS_TYPE=$(echo "$BODY" | grep -q '### Type of change' && echo 1 || echo 0)
              HAS_WHAT=$(echo "$BODY" | grep -q '### What does this PR do?' && echo 1 || echo 0)
              HAS_VERIFY=$(echo "$BODY" | grep -q '### How did you verify your code works?' && echo 1 || echo 0)
              HAS_SCREENSHOTS=$(echo "$BODY" | grep -q '### Screenshots / recordings' && echo 1 || echo 0)
              HAS_CHECKLIST=$(echo "$BODY" | grep -q '### Checklist' && echo 1 || echo 0)

              if [ "$HAS_ISSUE_SEC" = 0 ] || [ "$HAS_TYPE" = 0 ] || [ "$HAS_WHAT" = 0 ] || [ "$HAS_VERIFY" = 0 ] || [ "$HAS_SCREENSHOTS" = 0 ] || [ "$HAS_CHECKLIST" = 0 ]; then
                add_issue "PR 描述缺少必要的模板段落，请使用 [PR 模板](https://atomgit.com/openharmony-sig/deveco-code/blob/develop/.gitcode/pull_request_template.md)。"
              fi

              # 检查段落顺序
              TPL_PATTERN='### Issue for this PR|### Type of change|### What does this PR do\?|### How did you verify your code works\?|### Screenshots / recordings|### Checklist'
              ACTUAL_ORDER=$(echo "$BODY" | grep -E "^($TPL_PATTERN)$" | tr '\n' '|')
              EXPECTED_ORDER=$(echo "$TPL_HEADERS" | tr '\n' '|')
              if [ -n "$ACTUAL_ORDER" ] && [ "$ACTUAL_ORDER" != "$EXPECTED_ORDER" ]; then
                add_issue "段落顺序与 PR 模板不一致，请按模板顺序排列。"
              fi

              # 检查 Type of change 选项文案
              if [ "$HAS_TYPE" = 1 ]; then
                TYPE_CONTENT=$(echo "$BODY" | awk '/^### Type of change$/{f=1;next} /^### /{if(f)exit} f{print}')
                if ! echo "$TYPE_CONTENT" | grep -qi '\- \[x\]'; then
                  add_issue '未勾选任何"变更类型"选项，请至少选择一项。'
                fi
                for opt in "Bug fix" "New feature" "Refactor / code improvement" "Documentation"; do
                  if ! echo "$TYPE_CONTENT" | grep -qF "$opt"; then
                    add_issue "\"Type of change\" 段落缺少模板选项: \`$opt\`，请使用 PR 模板原文选项。"
                  fi
                done
              fi

              # 检查 What does this PR do 内容
              if [ "$HAS_WHAT" = 1 ]; then
                WHAT_CONTENT=$(echo "$BODY" | awk '/^### What does this PR do\?$/{f=1;next} /^### /{if(f)exit} f{print}' | tr -d '[:space:]')
                if [ -z "$WHAT_CONTENT" ]; then
                  add_issue '"What does this PR do?" 段落为空，请描述你的改动。'
                fi
              fi

              CLEAN_TITLE=$(echo "$TITLE" | sed 's/^\[[^]]*\]//')
              if ! echo "$CLEAN_TITLE" | grep -qP '^(docs|refactor|feat)'; then
                LINKED_ISSUES=$(bash .gitcode/scripts/gitcode-api.sh list-linked-issues "$PR_NUMBER")
                LINKED_COUNT=$(echo "$LINKED_ISSUES" | jq -r 'if type == "array" then length else 0 end' 2>/dev/null)
                if [ "$LINKED_COUNT" = 0 ]; then
                  add_issue '未关联 Issue，请在 PR 描述中添加 `Closes #<编号>` 引用相关 Issue。'
                fi
              fi

              # 检查 How did you verify 内容
              if [ "$HAS_VERIFY" = 1 ]; then
                VERIFY_CONTENT=$(echo "$BODY" | awk '/^### How did you verify your code works\?$/{f=1;next} /^### /{if(f)exit} f{print}' | tr -d '[:space:]')
                if [ -z "$VERIFY_CONTENT" ]; then
                  add_issue '"How did you verify your code works?" 段落为空，请说明你如何测试。'
                fi
              fi

              # 检查 Checklist 选项文案
              if [ "$HAS_CHECKLIST" = 1 ]; then
                CHECKLIST_CONTENT=$(echo "$BODY" | awk '/^### Checklist$/{f=1;next} /^### /{if(f)exit} f{print}')
                CHECKED=$(echo "$CHECKLIST_CONTENT" | grep -c '\- \[x\]' 2>/dev/null) || CHECKED=0
                if [ "$CHECKED" -lt 2 ]; then
                  add_issue '清单项未全部勾选，请确认你已在本地测试且未包含无关改动。'
                fi
                for opt in "I have tested my changes locally" "I have not included unrelated changes in this PR"; do
                  if ! echo "$CHECKLIST_CONTENT" | grep -qF "$opt"; then
                    add_issue "\"Checklist\" 段落缺少模板选项: \`$opt\`，请使用 PR 模板原文选项。"
                  fi
                done
              fi

              HAS_LABEL=$(echo "$PR_DATA" | jq -r '.labels[].name' 2>/dev/null | grep -q '^waiting_on_author$' && echo 1 || echo 0)

              if [ -n "$ISSUES" ]; then
                echo "PR is non-compliant"

                bash .gitcode/scripts/gitcode-api.sh add-label "$PR_NUMBER" waiting_on_author
                bash .gitcode/scripts/gitcode-api.sh reset-test "$PR_NUMBER" || true

                COMMENT_BODY=$(printf '<!-- pr-compliance -->\n## ✅ PR 模板合规检查\n\n此 PR 未完全符合我们的[贡献指南](https://atomgit.com/openharmony-sig/deveco-code/blob/develop/CONTRIBUTING.md)和 [PR 模板](https://atomgit.com/openharmony-sig/deveco-code/blob/develop/.gitcode/pull_request_template.md)。\n\n**需要修复的问题：**\n%s\n\n⏰ 请在 **3 小时内**编辑此 PR 描述以解决上述问题，否则将被自动关闭。\n\n如果您认为此标记有误，请联系维护者。' "$ISSUES")

                echo "$COMMENT_BODY" | bash .gitcode/scripts/gitcode-api.sh post-comment "$PR_NUMBER"
                exit 1
              elif [ "$HAS_LABEL" = 1 ]; then
                echo "PR is now compliant, removing label"
                bash .gitcode/scripts/gitcode-api.sh remove-label "$PR_NUMBER" waiting_on_author

                COMMENTS=$(bash .gitcode/scripts/gitcode-api.sh list-comments "$PR_NUMBER")
                for CID in $(echo "$COMMENTS" \
                  | jq -r '.[] | select(.body | contains("pr-standards") or contains("pr-compliance")) | .id' 2>/dev/null); do
                  bash .gitcode/scripts/gitcode-api.sh delete-comment "$CID"
                done

                {
                  echo '## ✅ 已符合贡献指南'
                  echo ''
                  echo '感谢更新你的 PR！现已通过模板检查。👍'
                  echo ''
                  echo '**合入前还需要：**'
                  echo '- 至少一个审查人通过'
                  echo '- openharmony_ci 测试通过'
                  echo ''
                  echo '满足后评论 `/merge` 合并，或等待自动合并。'
                } | bash .gitcode/scripts/gitcode-api.sh post-comment "$PR_NUMBER"

                bash .gitcode/scripts/gitcode-api.sh approve-test "$PR_NUMBER" passed || true
              else
                echo "PR is compliant"

                {
                  echo '## ✅ 已符合贡献指南'
                  echo ''
                  echo '**合入前还需要：**'
                  echo '- 至少一个审查人通过'
                  echo '- openharmony_ci 测试通过'
                  echo ''
                  echo '满足后评论 `/merge` 合并，或等待自动合并。'
                } | bash .gitcode/scripts/gitcode-api.sh post-comment "$PR_NUMBER"

                bash .gitcode/scripts/gitcode-api.sh approve-test "$PR_NUMBER" passed || true
              fi

              echo "## PR 标准检查" >> "$ATOMGIT_STEP_SUMMARY"
              echo "✅ PR #$PR_NUMBER 检查完成" >> "$ATOMGIT_STEP_SUMMARY"

