name: Compliance Close

on:
  schedule:
    # 每小时扫一次：合规关闭窗口是 3 小时，分钟级精度没有必要
    - cron: '0 20 * * * ?'
  workflow_dispatch:

concurrency:
  # 禁止并发：新运行抢占同一 MR 的旧运行，其余排队等待
  enable: true
  max: 1
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  repository: read
  issue: write
  note: write

stages:
  close:
    name: 关闭超时不合规项目
    jobs:
      close-non-compliant:
        name: 关闭超时 Issue 和 PR
        runs-on: ubuntu-latest
        env:
          GITCODE_API: https://atomgit.com/api/v5
          GITCODE_REPO: ${{ atomgit.repository }}
        steps:
          - name: 检出代码
            uses: checkout
            with:
              fetch-depth: 1

          - name: 关闭超时不合规 Issue 和 PR
            env:
              GITCODE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
            run: |
              CLOSED=0
              SKIPPED=0
              NOW_EPOCH=$(date +%s)
              # 修改窗口时长后，必须同步 pr-standards / issue-check / pr-guide 里对贡献者的承诺文案
              WINDOW_HOURS=3
              WINDOW_SECONDS=$((WINDOW_HOURS * 60 * 60))

              check_and_close() {
                TYPE="$1"
                if [ "$TYPE" = "pulls" ]; then KIND="PR"; else KIND="Issue"; fi

                RESPONSE=$(curl -s -H "Authorization: Bearer $GITCODE_TOKEN" \
                  "$GITCODE_API/repos/$GITCODE_REPO/$TYPE?state=open&labels=waiting_on_author&per_page=100" 2>/dev/null)

                ROWS=$(echo "$RESPONSE" | jq -r '.[] | "\(.number // .iid)\t\(.updated_at // "")"' 2>/dev/null)

                while IFS=$'\t' read -r NUMBER UPDATED_AT; do
                  if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
                    continue
                  fi
                  echo "Checking $KIND #$NUMBER"

                  COMMENTS=$(GITCODE_TYPE=$TYPE bash .gitcode/scripts/gitcode-api.sh list-comments "$NUMBER" 2>/dev/null)
                  COMMENT_CREATED=$(echo "$COMMENTS" \
                    | jq -r '.[] | select(.body | contains("issue-compliance") or contains("pr-compliance") or contains("pr-standards")) | .created_at' 2>/dev/null | sort | tail -1)

                  if [ -z "$COMMENT_CREATED" ] || [ "$COMMENT_CREATED" = "null" ]; then
                    echo "  No compliance comment found, skipping"
                    SKIPPED=$((SKIPPED + 1))
                    continue
                  fi

                  COMMENT_EPOCH=$(date -d "$COMMENT_CREATED" +%s 2>/dev/null || echo 0)
                  if [ "$COMMENT_EPOCH" -eq 0 ]; then
                    echo "  Could not parse comment date, skipping"
                    SKIPPED=$((SKIPPED + 1))
                    continue
                  fi

                  # 作者在被标记之后又改过（Issue 复查是每天一次），交给复查处理，不关闭
                  if [ -n "$UPDATED_AT" ]; then
                    UPDATED_EPOCH=$(date -d "$UPDATED_AT" +%s 2>/dev/null || echo 0)
                    if [ "$UPDATED_EPOCH" -gt $((COMMENT_EPOCH + 60)) ]; then
                      echo "  Edited after the compliance comment, waiting for recheck"
                      SKIPPED=$((SKIPPED + 1))
                      continue
                    fi
                  fi

                  AGE=$((NOW_EPOCH - COMMENT_EPOCH))
                  if [ "$AGE" -lt "$WINDOW_SECONDS" ]; then
                    echo "  Still within ${WINDOW_HOURS}h window ($(( AGE / 60 ))m elapsed)"
                    SKIPPED=$((SKIPPED + 1))
                    continue
                  fi

                  echo "  Closing: compliance window expired ($KIND)"

                  {
                    echo "此${KIND}已被自动关闭，因为未在 ${WINDOW_HOURS} 小时内按照我们的[贡献指南](https://atomgit.com/openharmony-sig/deveco-code/blob/develop/CONTRIBUTING.md)进行修改。"
                    echo ""
                    echo "欢迎按照规范重新提交${KIND}。"
                  } | GITCODE_TYPE=$TYPE bash .gitcode/scripts/gitcode-api.sh post-comment "$NUMBER" 2>/dev/null

                  GITCODE_TYPE=$TYPE bash .gitcode/scripts/gitcode-api.sh remove-label "$NUMBER" waiting_on_author 2>/dev/null
                  GITCODE_TYPE=$TYPE bash .gitcode/scripts/gitcode-api.sh close-issue "$NUMBER" 2>/dev/null

                  CLOSED=$((CLOSED + 1))
                done <<< "$ROWS"
              }

              check_and_close "issues"
              check_and_close "pulls"

              echo "## 合规关闭检查" >> "$ATOMGIT_STEP_SUMMARY"
              echo "" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 项目 | 值 |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 检查时间 | $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S') |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 关闭数 | $CLOSED |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 跳过数 | $SKIPPED |" >> "$ATOMGIT_STEP_SUMMARY"
