name: Stale Issues

on:
  schedule:
    - cron: '0 0 3 * * ?'
  workflow_dispatch:
    inputs:
      days:
        description: "判定天数：超过多少天未更新就关闭"
        required: false
        default: "30"
        type: string
      dry_run:
        description: "预览模式（true 时只打印不关闭）"
        required: false
        default: "false"
        type: string

permissions:
  repository: read
  issue: write
  note: write

stages:
  close-stale:
    name: 关闭长期未更新 Issue
    jobs:
      close-stale:
        name: scan-and-close
        runs-on: ubuntu-latest
        env:
          GITCODE_API: https://atomgit.com/api/v5
          GITCODE_REPO: ${{ atomgit.repository }}
        steps:
          - name: 检出代码
            uses: checkout
            with:
              fetch-depth: 1

          - name: 扫描并关闭
            env:
              GITCODE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
              STALE_DAYS: ${{ inputs.days || '30' }}
              DRY_RUN: ${{ inputs.dry_run || 'false' }}
            run: bash .gitcode/scripts/close-stale-issues.sh
