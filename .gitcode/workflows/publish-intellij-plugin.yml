name: Publish IntelliJ Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "插件版本号 (e.g. 1.0.0)"
        required: true
        type: string

concurrency:
  # 禁止并发：新运行抢占同一 MR 的旧运行，其余排队等待
  enable: true
  max: 1
  exceed-action: QUEUE
  preemption:
    enable: true
    events: [mr_id]

permissions:
  repository: read

jobs:
  release:
    name: build-and-publish-intellij-plugin
    runs-on: ubuntu-latest
    env:
      CURRENT_REPOSITORY: ${{ atomgit.repository }}
      GITCODE_API: ${{ atomgit.api_url }}
    steps:
      - name: 检出代码
        uses: checkout
        with:
          fetch-depth: 0

      - name: 设置 JDK 21
        uses: setup-jdk
        with:
          jdk-version: 21
          distribution: 'temurin'

      - name: 设置 Node.js
        uses: setup-node
        with:
          node-version: 22

      - name: 安装 Bun
        run: NPM_CONFIG_REGISTRY=https://registry.npmmirror.com npm install -g bun@1.3.14

      - name: 设置版本
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "ERROR: Plugin version must not be empty"
            exit 1
          fi
          echo "PLUGIN_VERSION=$VERSION" >> "$ATOMGIT_ENV"
          echo "PLUGIN_RELEASE_TAG=intellij-plugin-v$VERSION" >> "$ATOMGIT_ENV"

          echo "## IntelliJ 插件版本" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 版本 | \`$VERSION\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| Release Tag | \`intellij-plugin-v$VERSION\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 分支 | \`$ATOMGIT_REF_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"

      - name: 准备构建环境
        run: NODEJS_ORG_MIRROR=https://npmmirror.com/mirrors/node NPM_CONFIG_REGISTRY=https://registry.npmmirror.com bun install

      - name: 使用镜像下载 Gradle 发行版
        run: sed -i 's|services.gradle.org/distributions/|mirrors.huaweicloud.com/gradle/|' integrations/deveco-code/gradle/wrapper/gradle-wrapper.properties

      - name: 构建 IntelliJ 插件六个安装包
        id: build
        env:
          NPM_REGISTRY: https://registry.npmmirror.com
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
        run: |
          cd integrations/deveco-code
          ./gradlew --no-daemon --no-configuration-cache buildCompatibilityPackages -Pversion="$PLUGIN_VERSION"

          PLUGIN_DIR="build/compatibility-packages"
          PLUGIN_COUNT=$(find "$PLUGIN_DIR" -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')
          if [ "$PLUGIN_COUNT" -ne 6 ]; then
            echo "ERROR: Expected 6 IntelliJ plugin packages, found $PLUGIN_COUNT"
            find "$PLUGIN_DIR" -maxdepth 1 -type f -name '*.zip' -print || true
            exit 1
          fi

      - name: 创建 GitCode Release 并上传插件安装包
        id: upload
        run: |
          API="$GITCODE_API"
          OWNER="${CURRENT_REPOSITORY%%/*}"
          REPO="${CURRENT_REPOSITORY#*/}"
          TOKEN="${{ secrets.RELEASE_TOKEN }}"
          TAG="$PLUGIN_RELEASE_TAG"
          PLUGIN_DIR="integrations/deveco-code/build/compatibility-packages"
          COMMIT_SHA=$(git rev-parse HEAD)

          RELEASE_RESPONSE=$(mktemp)
          RELEASE_HTTP_CODE=$(curl -sS -o "$RELEASE_RESPONSE" -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "$API/repos/$OWNER/$REPO/releases/tags/$TAG")
          RELEASE_INFO=$(cat "$RELEASE_RESPONSE")
          rm -f "$RELEASE_RESPONSE"

          case "$RELEASE_HTTP_CODE" in
            2*)
              if ! echo "$RELEASE_INFO" | jq -e 'type == "object"' >/dev/null 2>&1; then
                echo "ERROR: GitCode returned a non-JSON release response (HTTP $RELEASE_HTTP_CODE): $RELEASE_INFO"
                exit 1
              fi
              RELEASE_TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name // empty')
              ;;
            404)
              RELEASE_INFO='{}'
              RELEASE_TAG=""
              ;;
            *)
              echo "ERROR: Failed to query release $TAG (HTTP $RELEASE_HTTP_CODE). Response: $RELEASE_INFO"
              exit 1
              ;;
          esac

          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_BODY="IntelliJ/DevEco Studio 插件 $PLUGIN_VERSION。包含 IDE 243 和 261 的 macOS ARM64、macOS x64、Windows x64 安装包。"
            RELEASE_PAYLOAD=$(jq -n \
              --arg tag "$TAG" \
              --arg name "IntelliJ Plugin $PLUGIN_VERSION" \
              --arg body "$RELEASE_BODY" \
              --arg commit "$COMMIT_SHA" \
              '{tag_name:$tag,name:$name,body:$body,prerelease:false,release_status:"latest",target_commitish:$commit}')
            RELEASE_RESPONSE=$(mktemp)
            RELEASE_HTTP_CODE=$(curl -sS -o "$RELEASE_RESPONSE" -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$RELEASE_PAYLOAD" \
              "$API/repos/$OWNER/$REPO/releases")
            RELEASE_INFO=$(cat "$RELEASE_RESPONSE")
            rm -f "$RELEASE_RESPONSE"
            case "$RELEASE_HTTP_CODE" in
              2*) ;;
              *)
                echo "ERROR: Failed to create release $TAG (HTTP $RELEASE_HTTP_CODE). Response: $RELEASE_INFO"
                exit 1
                ;;
            esac
            if ! echo "$RELEASE_INFO" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "ERROR: GitCode returned a non-JSON create response (HTTP $RELEASE_HTTP_CODE): $RELEASE_INFO"
              exit 1
            fi
            RELEASE_TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name // empty')
            if [ -z "$RELEASE_TAG" ]; then
              echo "ERROR: Failed to create release. Response: $RELEASE_INFO"
              exit 1
            fi
          fi

          for zipfile in "$PLUGIN_DIR"/*.zip; do
            FILENAME=$(basename "$zipfile")
            if echo "$RELEASE_INFO" | jq -e --arg name "$FILENAME" \
              '(.assets // .data.assets // [])[]? | select(.name == $name)' >/dev/null; then
              echo "Skipping existing asset $FILENAME"
              continue
            fi

            echo "Uploading $FILENAME ..."
            UPLOAD_RESPONSE=$(mktemp)
            UPLOAD_HTTP_CODE=$(curl -sS -o "$UPLOAD_RESPONSE" -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "$API/repos/$OWNER/$REPO/releases/$TAG/upload_url?file_name=$FILENAME")
            UPLOAD_INFO=$(cat "$UPLOAD_RESPONSE")
            rm -f "$UPLOAD_RESPONSE"
            case "$UPLOAD_HTTP_CODE" in
              2*) ;;
              *)
                echo "ERROR: Failed to get upload URL for $FILENAME (HTTP $UPLOAD_HTTP_CODE). Response: $UPLOAD_INFO"
                exit 1
                ;;
            esac
            if ! echo "$UPLOAD_INFO" | jq -e '(type == "string") or (type == "object")' >/dev/null 2>&1; then
              echo "ERROR: GitCode returned a non-JSON upload URL response (HTTP $UPLOAD_HTTP_CODE): $UPLOAD_INFO"
              exit 1
            fi
            OBS_URL=$(echo "$UPLOAD_INFO" | jq -r 'if type == "string" then . elif .url? then .url elif .upload_url? then .upload_url else empty end')
            if [ -z "$OBS_URL" ]; then
              echo "ERROR: No upload URL for $FILENAME. Response: $UPLOAD_INFO"
              exit 1
            fi

            HDR_PID=$(echo "$UPLOAD_INFO" | jq -r '(.headers // .data.headers // {})["x-obs-meta-project-id"] // empty')
            HDR_ACL=$(echo "$UPLOAD_INFO" | jq -r '(.headers // .data.headers // {})["x-obs-acl"] // empty')
            HDR_CB=$(echo "$UPLOAD_INFO" | jq -r '(.headers // .data.headers // {})["x-obs-callback"] // empty')
            HDR_CT=$(echo "$UPLOAD_INFO" | jq -r '(.headers // .data.headers // {})["Content-Type"] // "application/octet-stream"')

            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X PUT \
              -H "x-obs-meta-project-id: $HDR_PID" \
              -H "x-obs-acl: $HDR_ACL" \
              -H "x-obs-callback: $HDR_CB" \
              -H "Content-Type: $HDR_CT" \
              --upload-file "$zipfile" \
              "$OBS_URL")
            case "$HTTP_CODE" in
              2*) echo "Uploaded $FILENAME (HTTP $HTTP_CODE)" ;;
              *)
                echo "ERROR: Failed to upload $FILENAME (HTTP $HTTP_CODE)"
                exit 1
                ;;
            esac
          done

      - name: 步骤摘要
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.conclusion }}
          UPLOAD_RESULT: ${{ steps.upload.conclusion }}
        run: |
          OWNER="${CURRENT_REPOSITORY%%/*}"
          REPO="${CURRENT_REPOSITORY#*/}"
          echo "## IntelliJ 插件发布" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 项目 | 状态 |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 构建 | \`$BUILD_RESULT\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| Release 上传 | \`$UPLOAD_RESULT\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| Release | [查看](https://atomgit.com/$OWNER/$REPO/releases/$PLUGIN_RELEASE_TAG) |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "### 安装包" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          for zipfile in integrations/deveco-code/build/compatibility-packages/*.zip; do
            [ -f "$zipfile" ] || continue
            echo "- \`$(basename "$zipfile")\` ($(du -h "$zipfile" | cut -f1))" >> "$ATOMGIT_STEP_SUMMARY"
