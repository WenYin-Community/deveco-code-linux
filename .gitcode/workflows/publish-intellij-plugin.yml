# 构建单个 JetBrains 底座（243 或 261）的插件安装包，作为本次流水线运行的制品分发（不创建 Release）。
name: Build IntelliJ Plugin

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "JetBrains 底座版本"
        required: true
        type: choice
        options: ["243", "261"]
      version:
        description: "插件版本号 (e.g. 1.0.0)"
        required: true
        type: string
      channel:
        description: "CLI 发布渠道 (stable, beta, td)"
        required: false
        default: "stable"
        type: string

permissions:
  repository: read

jobs:
  build:
    name: build-intellij-plugin
    runs-on: ubuntu-latest
    env:
      DEVECO_CHANNEL: ${{ inputs.channel }}
      NODEJS_ORG_MIRROR: https://npmmirror.com/mirrors/node
      PLATFORM: ${{ inputs.platform }}
    steps:
      - name: 检出代码
        uses: checkout
        with:
          fetch-depth: 0

      - name: 设置 JDK 21
        uses: setup-jdk
        with:
          jdk-version: 21
          distribution: 'temurin'

      - name: 设置 Node.js
        uses: setup-node
        with:
          node-version: 22

      - name: 安装 Bun
        run: NPM_CONFIG_REGISTRY=https://registry.npmmirror.com npm install -g bun@1.4.2

      - name: 设置版本
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "ERROR: Plugin version must not be empty"
            exit 1
          fi
          if [ -z "$DEVECO_CHANNEL" ]; then
            echo "ERROR: Channel must not be empty"
            exit 1
          fi
          if [ "$PLATFORM" != "243" ] && [ "$PLATFORM" != "261" ]; then
            echo "ERROR: Platform must be 243 or 261"
            exit 1
          fi
          echo "PLUGIN_VERSION=$VERSION" >> "$ATOMGIT_ENV"
          echo "DEVECO_VERSION=$VERSION" >> "$ATOMGIT_ENV"

          echo "## IntelliJ 插件版本" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 底座版本 | \`$PLATFORM\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 版本 | \`$VERSION\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 渠道 | \`$DEVECO_CHANNEL\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 分支 | \`$ATOMGIT_REF_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"

      - name: 准备构建环境
        run: |
          NODEJS_ORG_MIRROR=https://npmmirror.com/mirrors/node \
            NPM_CONFIG_REGISTRY=https://registry.npmmirror.com \
            bun install --frozen-lockfile
          NPM_CONFIG_REGISTRY=https://registry.npmmirror.com \
            bun run --cwd packages/opencode postinstall

      - name: 准备 Gradle Wrapper
        run: |
          set -euo pipefail

          WRAPPER_DIR="integrations/intellij-plugin/gradle/wrapper"
          WRAPPER_JAR="$WRAPPER_DIR/gradle-wrapper.jar"
          WRAPPER_PROPERTIES="$WRAPPER_DIR/gradle-wrapper.properties"

          sed -i 's|services.gradle.org/distributions/|mirrors.huaweicloud.com/gradle/|' "$WRAPPER_PROPERTIES"
          GRADLE_VERSION=$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' "$WRAPPER_PROPERTIES")
          if [ -z "$GRADLE_VERSION" ]; then
            echo "ERROR: Unable to determine Gradle version from $WRAPPER_PROPERTIES"
            exit 1
          fi

          wrapper_is_valid() {
            [ -s "$WRAPPER_JAR" ] &&
              unzip -tq "$WRAPPER_JAR" >/dev/null &&
              unzip -Z1 "$WRAPPER_JAR" | grep -qx 'org/gradle/wrapper/GradleWrapperMain.class'
          }

          if ! wrapper_is_valid; then
            TMP_DIR=$(mktemp -d)
            trap 'rm -rf "$TMP_DIR"' EXIT
            GRADLE_ARCHIVE="$TMP_DIR/gradle-$GRADLE_VERSION-bin.zip"
            GRADLE_HOME="$TMP_DIR/gradle-$GRADLE_VERSION"
            WRAPPER_MAIN="$GRADLE_HOME/lib/plugins/gradle-wrapper-main-$GRADLE_VERSION.jar"

            echo "Restoring missing Gradle Wrapper bootstrap jar for Gradle $GRADLE_VERSION"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://mirrors.huaweicloud.com/gradle/gradle-$GRADLE_VERSION-bin.zip" \
              -o "$GRADLE_ARCHIVE"
            unzip -q "$GRADLE_ARCHIVE" \
              "gradle-$GRADLE_VERSION/lib/plugins/gradle-wrapper-main-$GRADLE_VERSION.jar" \
              -d "$TMP_DIR"
            unzip -p "$WRAPPER_MAIN" gradle-wrapper.jar > "$WRAPPER_JAR"
          fi

          wrapper_is_valid || {
            echo "ERROR: Gradle Wrapper bootstrap jar is missing or invalid"
            exit 1
          }
          chmod +x integrations/intellij-plugin/gradlew
          integrations/intellij-plugin/gradlew --version

      - name: 构建 IntelliJ 插件三个安装包
        id: build
        env:
          NPM_REGISTRY: https://registry.npmmirror.com
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
        run: |
          set -euo pipefail

          cd integrations/intellij-plugin
          ./gradlew --no-daemon --no-configuration-cache buildCompatibilityPackages \
            -Pversion="$PLUGIN_VERSION" \
            -Pplatform="$PLATFORM"

          PLUGIN_DIR="build/compatibility-packages"
          PLUGIN_COUNT=$(find "$PLUGIN_DIR" -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')
          if [ "$PLUGIN_COUNT" -ne 3 ]; then
            echo "ERROR: Expected 3 IntelliJ plugin packages, found $PLUGIN_COUNT"
            find "$PLUGIN_DIR" -maxdepth 1 -type f -name '*.zip' -print || true
            exit 1
          fi

          CHECK_DIR=$(mktemp -d)
          trap 'rm -rf "$CHECK_DIR"' EXIT
          for zipfile in "$PLUGIN_DIR"/*.zip; do
            entries=$(unzip -Z1 "$zipfile")
            plugin_jar=$(grep -E '(^|/)lib/deveco-code-jetbrains-plugin-[^/]+\.jar$' <<< "$entries" | head -1)
            if [ -z "$plugin_jar" ]; then
              echo "ERROR: Plugin implementation jar is missing from $(basename "$zipfile")"
              exit 1
            fi
            unzip -p "$zipfile" "$plugin_jar" > "$CHECK_DIR/plugin.jar"
            plugin_entries=$(unzip -Z1 "$CHECK_DIR/plugin.jar")
            if ! grep -qx 'META-INF/plugin.xml' <<< "$plugin_entries"; then
              echo "ERROR: plugin.xml is missing from $(basename "$zipfile")"
              exit 1
            fi
            if ! grep -Eq '^cli/bin/deveco(\.exe)?$' <<< "$plugin_entries"; then
              echo "ERROR: Bundled DevEco Code runtime is missing from $(basename "$zipfile")"
              exit 1
            fi
            if ! grep -qx 'cli/manifest.txt' <<< "$plugin_entries"; then
              echo "ERROR: Bundled runtime manifest is missing from $(basename "$zipfile")"
              exit 1
            fi
            if [ "$PLATFORM" = "243" ]; then
              node_binary='cli/bin/node'
              if [[ "$(basename "$zipfile")" == *-windows-x64.zip ]]; then
                node_binary='cli/bin/node.exe'
              fi
              if ! grep -qx "$node_binary" <<< "$plugin_entries"; then
                echo "ERROR: Bundled Node runtime is missing from $(basename "$zipfile")"
                exit 1
              fi
            fi
            if ! grep -Eq '(^|/)lib/acp-model-jvm-[^/]+\.jar$' <<< "$entries"; then
              echo "ERROR: ACP model jar is missing from $(basename "$zipfile")"
              exit 1
            fi
            if ! grep -Eq '(^|/)lib/sqlite-jdbc-[^/]+\.jar$' <<< "$entries"; then
              echo "ERROR: SQLite JDBC jar is missing from $(basename "$zipfile")"
              exit 1
            fi

            if [ "$PLATFORM" = "243" ]; then
              if ! grep -Eq '(^|/)lib/acp-jvm-0\.25\.0-deveco243\.jar$' <<< "$entries"; then
                echo "ERROR: Adapted ACP jar is missing from $(basename "$zipfile")"
                exit 1
              fi
              if grep -Eq '(^|/)lib/acp-jvm-0\.25\.0\.jar$' <<< "$entries"; then
                echo "ERROR: Original ACP jar must not be packaged for 243: $(basename "$zipfile")"
                exit 1
              fi
            elif ! grep -Eq '(^|/)lib/acp-jvm-0\.25\.0\.jar$' <<< "$entries"; then
              echo "ERROR: ACP jar is missing from $(basename "$zipfile")"
              exit 1
            fi
          done

      - name: 上传插件安装包为流水线制品
        id: upload
        uses: upload-artifact
        with:
          name: deveco-code-core-plugin-${{ inputs.version }}
          path: integrations/intellij-plugin/build/compatibility-packages/*.zip
          retention-days: 1

      - name: 步骤摘要
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.conclusion }}
          UPLOAD_RESULT: ${{ steps.upload.conclusion }}
        run: |
          echo "## IntelliJ 插件构建" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 项目 | 状态 |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 构建 | \`$BUILD_RESULT\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 制品上传 | \`$UPLOAD_RESULT\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "### 安装包" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "安装包已上传为本次运行的制品，保留 1 天，请在运行页面的「制品」页签下载。" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          for zipfile in integrations/intellij-plugin/build/compatibility-packages/*.zip; do
            [ -f "$zipfile" ] || continue
            echo "- \`$(basename "$zipfile")\` ($(du -h "$zipfile" | cut -f1))" >> "$ATOMGIT_STEP_SUMMARY"
          done
