# 构建单个 JetBrains 底座（243 或 261）的插件安装包，作为本次流水线运行的制品分发（不创建 Release）。
name: Build IntelliJ Plugin

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "JetBrains 底座版本"
        required: true
        type: choice
        options: ["243", "261"]
      version:
        description: "插件版本号 (e.g. 1.0.0)"
        required: true
        type: string
      channel:
        description: "CLI 发布渠道 (stable, beta, td)"
        required: false
        default: "stable"
        type: string

permissions:
  repository: read

jobs:
  build:
    name: build-intellij-plugin
    runs-on: ubuntu-latest
    env:
      DEVECO_CHANNEL: ${{ inputs.channel }}
      PLATFORM: ${{ inputs.platform }}
    steps:
      - name: 检出代码
        uses: checkout
        with:
          fetch-depth: 0

      - name: 设置 JDK 21
        uses: setup-jdk
        with:
          jdk-version: 21
          distribution: 'temurin'

      - name: 设置 Node.js
        uses: setup-node
        with:
          node-version: 22

      - name: 安装 Bun
        run: NPM_CONFIG_REGISTRY=https://registry.npmmirror.com npm install -g bun@1.4.2

      - name: 设置版本
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "ERROR: Plugin version must not be empty"
            exit 1
          fi
          if [ -z "$DEVECO_CHANNEL" ]; then
            echo "ERROR: Channel must not be empty"
            exit 1
          fi
          if [ "$PLATFORM" != "243" ] && [ "$PLATFORM" != "261" ]; then
            echo "ERROR: Platform must be 243 or 261"
            exit 1
          fi
          echo "PLUGIN_VERSION=$VERSION" >> "$ATOMGIT_ENV"
          echo "DEVECO_VERSION=$VERSION" >> "$ATOMGIT_ENV"

          echo "## IntelliJ 插件版本" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 底座版本 | \`$PLATFORM\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 版本 | \`$VERSION\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 渠道 | \`$DEVECO_CHANNEL\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 分支 | \`$ATOMGIT_REF_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"

      - name: 准备构建环境
        run: NODEJS_ORG_MIRROR=https://npmmirror.com/mirrors/node NPM_CONFIG_REGISTRY=https://registry.npmmirror.com bun install

      - name: 使用镜像下载 Gradle 发行版
        run: sed -i 's|services.gradle.org/distributions/|mirrors.huaweicloud.com/gradle/|' integrations/intellij-plugin/gradle/wrapper/gradle-wrapper.properties

      - name: 构建 IntelliJ 插件三个安装包
        id: build
        env:
          NPM_REGISTRY: https://registry.npmmirror.com
          NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
        run: |
          cd integrations/intellij-plugin
          ./gradlew --no-daemon --no-configuration-cache buildCompatibilityPackages \
            -Pversion="$PLUGIN_VERSION" \
            -Pplatform="$PLATFORM"

          PLUGIN_DIR="build/compatibility-packages"
          PLUGIN_COUNT=$(find "$PLUGIN_DIR" -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')
          if [ "$PLUGIN_COUNT" -ne 3 ]; then
            echo "ERROR: Expected 3 IntelliJ plugin packages, found $PLUGIN_COUNT"
            find "$PLUGIN_DIR" -maxdepth 1 -type f -name '*.zip' -print || true
            exit 1
          fi

      - name: 上传插件安装包为流水线制品
        id: upload
        uses: upload-artifact
        with:
          name: deveco-code-core-plugin-${{ inputs.version }}
          path: integrations/intellij-plugin/build/compatibility-packages/*.zip
          retention-days: 1

      - name: 步骤摘要
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.conclusion }}
          UPLOAD_RESULT: ${{ steps.upload.conclusion }}
        run: |
          echo "## IntelliJ 插件构建" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 项目 | 状态 |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 构建 | \`$BUILD_RESULT\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "| 制品上传 | \`$UPLOAD_RESULT\` |" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "### 安装包" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          echo "安装包已上传为本次运行的制品，保留 1 天，请在运行页面的「制品」页签下载。" >> "$ATOMGIT_STEP_SUMMARY"
          echo "" >> "$ATOMGIT_STEP_SUMMARY"
          for zipfile in integrations/intellij-plugin/build/compatibility-packages/*.zip; do
            [ -f "$zipfile" ] || continue
            echo "- \`$(basename "$zipfile")\` ($(du -h "$zipfile" | cut -f1))" >> "$ATOMGIT_STEP_SUMMARY"
          done
