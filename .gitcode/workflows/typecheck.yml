name: Typecheck

on:
  pull_request:
    types:
      - open
      - reopen
      - update
    branches: ["**"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  repository: read
  pr: read

stages:
  check:
    name: 代码检查
    jobs:
      typecheck:
        name: typecheck
        runs-on: ubuntu-latest
        steps:
          - name: 检出代码
            uses: checkout
            with:
              fetch-depth: 0
              ref: ${{ atomgit.sha }}
          - name: 设置 Node.js
            uses: setup-node
            with:
              node-version: 22
          - name: 安装 Bun
            run: NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ npm install -g bun@1.4.2
          - name: 缓存 bun 依赖
            uses: cache
            with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
              restore-keys: |
                bun-${{ runner.os }}-
          - name: 准备构建环境
            run: NODEJS_ORG_MIRROR=https://mirrors.huaweicloud.com/nodejs NPM_CONFIG_REGISTRY=https://mirrors.huaweicloud.com/repository/npm/ bun install --frozen-lockfile
          - name: 运行 Typecheck
            run: bun turbo typecheck --concurrency=1
          - name: 步骤摘要
            if: always()
            run: |
              echo "## Typecheck" >> "$ATOMGIT_STEP_SUMMARY"
              echo "" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 项目 | 状态 |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "|------|------|" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 分支 | \`$ATOMGIT_REF_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"
              echo "| 触发 | \`$ATOMGIT_EVENT_NAME\` |" >> "$ATOMGIT_STEP_SUMMARY"
